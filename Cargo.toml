[workspace]
resolver = "2"
members = [
    "crates/codegraph-core",
    "crates/codegraph-security",
    "crates/codegraphd",
    "crates/codegraph-mcp",
    "crates/codegraph-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Khalid Farooq <wandererkhalid@gmail.com>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/khalidfarooq/codegraph-mcp"
readme = "README.md"

[workspace.dependencies]
dunce = "=1.0.5"
regex = "=1.10.6"
rand = "=0.8.5"
thiserror = "=1.0.63"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
serde = { version = "=1.0.214", features = ["derive"] }
serde_json = "=1.0.128"
libc = "0.2"
tokio = { version = "=1.39.3", features = ["full"] }
walkdir = "=2.5.0"
petgraph = "=0.6.5"
tree-sitter = "0.22"
tree-sitter-typescript = "=0.21.2"
tree-sitter-python = "0.21"
tree-sitter-rust = "=0.21.2"
tree-sitter-go = "0.21"
clap = { version = "=4.4.18", features = ["derive"] }
fs4 = { version = "0.12", features = ["tokio"] }
codegraph-security = { path = "crates/codegraph-security" }
codegraph-core = { path = "crates/codegraph-core" }
codegraph-mcp = { path = "crates/codegraph-mcp" }
codegraphd = { path = "crates/codegraphd" }
